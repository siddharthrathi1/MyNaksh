services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-mynaksh-dev-pass}
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_USER:-neo4j} -p $${NEO4J_PASSWORD:-mynaksh-dev-pass} 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    build: .
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy

  # Test runner: `docker compose run --rm tests` — runs the suite against the in-memory
  # store AND the real Neo4j above. No API keys needed (FakeLLM).
  tests:
    build: .
    profiles: ["test"]
    volumes:
      - .:/srv
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mynaksh-dev-pass}
    command: ["pytest", "-q"]
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
