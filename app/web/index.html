<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyNaksh Chat</title>
<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b70; --border: #e3e1dc;
    --accent: #5b4bdb; --accent-text: #ffffff; --user: #5b4bdb; --bot: #f0eee9; --chip: #ecebfa;
    --warn: #b45309;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --panel: #1c1c1f; --text: #ececf0; --muted: #9a9aa3; --border: #2c2c31;
      --accent: #8b7cf6; --accent-text: #0f0f12; --user: #6d5ce8; --bot: #26262b; --chip: #2a2745;
      --warn: #f59e0b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  .app { display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
  main { display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
  input, textarea, button { font: inherit; color: inherit; }
  input { padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); width: 130px; }
  button { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .msg.err { align-self: center; color: var(--warn); font-size: 13px; }
  .meta { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: var(--chip); color: var(--text); }
  .chip.warn { color: var(--warn); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel); }
  textarea { flex: 1; resize: none; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); height: 44px; }
  aside { border-left: 1px solid var(--border); background: var(--panel); overflow-y: auto; padding: 16px; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 8px; }
  aside section { margin-bottom: 20px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; }
  .mem { font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .mem small { color: var(--muted); display: block; }
  .empty { color: var(--muted); font-size: 13px; }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    aside { border-left: 0; border-top: 1px solid var(--border); max-height: 35vh; }
    .msg { max-width: 90%; }
  }
</style>
</head>
<body>
<div class="app">
  <main>
    <header>
      <h1>MyNaksh</h1>
      <label>User <input id="user" autocomplete="off"></label>
      <label>Session <input id="session" autocomplete="off"></label>
      <button id="newSession" type="button" title="Start a new conversation (long-term memory is kept)">New chat</button>
      <button id="forget" type="button" title="Delete all long-term memories for this user">Forget me</button>
    </header>
    <div id="log"></div>
    <form id="form">
      <textarea id="input" placeholder="Ask about your career, relationships, health..." autofocus></textarea>
      <button class="primary" id="send">Send</button>
    </form>
  </main>
  <aside>
    <section><h2>Profile</h2><div id="profile" class="empty">No profile yet.</div></section>
    <section><h2>Shared Brain memories</h2><div id="memories" class="empty">Nothing remembered yet.</div></section>
  </aside>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const store = {
    get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  };
  const rand = () => Math.random().toString(36).slice(2, 8);

  $("user").value = store.get("mn_user") || "user-" + rand();
  $("session").value = "session-" + rand();
  store.set("mn_user", $("user").value);

  function add(cls, text, meta) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    if (meta && meta.length) {
      const m = document.createElement("div");
      m.className = "meta";
      for (const [label, warn] of meta) {
        const c = document.createElement("span");
        c.className = "chip" + (warn ? " warn" : "");
        c.textContent = label;
        m.appendChild(c);
      }
      el.appendChild(m);
    }
    $("log").appendChild(el);
    $("log").scrollTop = $("log").scrollHeight;
    return el;
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, { headers: { "content-type": "application/json" }, ...opts });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.detail?.message || body.detail || body.message || res.statusText);
    return body;
  }

  async function refreshSidebar() {
    const uid = encodeURIComponent($("user").value);
    try {
      const p = await api(`/users/${uid}`);
      const rows = [["Name", p.name], ["Born", p.dob], ["Time", p.tob], ["Place", p.birth_place], ["Sun sign", p.sun_sign], ["Language", p.preferred_language]]
        .filter(([, v]) => v);
      $("profile").className = rows.length ? "" : "empty";
      $("profile").innerHTML = rows.length ? "<dl></dl>" : "No profile yet.";
      for (const [k, v] of rows) {
        const dt = document.createElement("dt"); dt.textContent = k;
        const dd = document.createElement("dd"); dd.textContent = v;
        $("profile").firstChild.append(dt, dd);
      }
    } catch { $("profile").className = "empty"; $("profile").textContent = "No profile yet."; }
    try {
      const mems = await api(`/users/${uid}/memories`);
      $("memories").className = mems.length ? "" : "empty";
      $("memories").textContent = mems.length ? "" : "Nothing remembered yet.";
      for (const m of mems) {
        const d = document.createElement("div");
        d.className = "mem";
        d.textContent = m.text;
        const s = document.createElement("small");
        s.textContent = [m.kind, m.life_area, m.target_date].filter(Boolean).join(" · ");
        d.appendChild(s);
        $("memories").appendChild(d);
      }
    } catch { $("memories").className = "empty"; $("memories").textContent = "Nothing remembered yet."; }
  }

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = $("input").value.trim();
    if (!message) return;
    $("input").value = "";
    add("user", message);
    $("send").disabled = true;
    const pending = add("bot", "…");
    try {
      const r = await api("/chat", {
        method: "POST",
        body: JSON.stringify({ user_id: $("user").value, session_id: $("session").value, message }),
      });
      pending.remove();
      const meta = r.context_used.map((c) => [c]);
      if (r.memories_written.length) meta.push([`+${r.memories_written.length} memory`]);
      for (const why of r.degraded_reasons) meta.push([why, true]);
      add("bot", r.response, meta);
      refreshSidebar();
    } catch (err) {
      pending.remove();
      add("err", "Error: " + err.message);
    } finally {
      $("send").disabled = false;
      $("input").focus();
    }
  });

  $("input").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
  });
  $("newSession").addEventListener("click", () => {
    $("session").value = "session-" + rand();
    $("log").innerHTML = "";
    add("err", "New conversation started. Long-term memory carries over.");
  });
  $("forget").addEventListener("click", async () => {
    if (!confirm("Delete all long-term memories for this user?")) return;
    try { await api(`/users/${encodeURIComponent($("user").value)}/memories`, { method: "DELETE" }); } catch {}
    refreshSidebar();
  });
  $("user").addEventListener("change", () => { store.set("mn_user", $("user").value); refreshSidebar(); });

  refreshSidebar();
</script>
</body>
</html>
